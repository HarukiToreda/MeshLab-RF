[platformio]
default_envs = t114-survey-mobile, t114-survey-base

[env]
platform = platformio/nordicnrf52@10.12.0
board = heltec_mesh_node_t114_signal
framework = arduino
monitor_speed = 115200
extra_scripts = post:scripts/make_uf2.py
build_flags =
  -std=gnu++17
  -Ivariants/heltec_mesh_node_t114
  -DTINYGPS_OPTION_NO_CUSTOM_FIELDS
  -DRADIOLIB_EXCLUDE_CC1101=1
  -DRADIOLIB_EXCLUDE_NRF24=1
  -DRADIOLIB_EXCLUDE_RF69=1
  -DRADIOLIB_EXCLUDE_SX1231=1
  -DRADIOLIB_EXCLUDE_SX1233=1
  -DRADIOLIB_EXCLUDE_SI443X=1
  -DRADIOLIB_EXCLUDE_RFM2X=1
  -DRADIOLIB_EXCLUDE_LORAWAN=1
lib_deps =
  jgromes/RadioLib@7.7.1
  mikalhart/TinyGPSPlus@1.0.3
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
  adafruit/Adafruit SPIFlash@5.1.1

[env:t114-survey-mobile]
build_flags =
  ${env.build_flags}
  -DSURVEY_ROLE_MOBILE=1
  -DSURVEY_BUILD_NAME=\"mobile\"
custom_role = mobile

[env:t114-survey-base]
build_flags =
  ${env.build_flags}
  -DSURVEY_ROLE_BASE=1
  -DSURVEY_BUILD_NAME=\"base\"
custom_role = base
