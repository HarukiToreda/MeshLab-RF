name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            kind: windows
            python_architecture: x64
            asset: MeshLabRF.exe
          - label: macOS Apple Silicon
            os: macos-15
            kind: macos
            python_architecture: arm64
            target_architecture: arm64
            asset: MeshLabRF-macOS-arm64.dmg
          - label: macOS Intel
            os: macos-15-intel
            kind: macos
            python_architecture: x64
            target_architecture: x86_64
            asset: MeshLabRF-macOS-x86_64.dmg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_architecture }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Build Windows executable
        if: matrix.kind == 'windows'
        shell: pwsh
        run: .\build.ps1

      - name: Build macOS application
        if: matrix.kind == 'macos'
        shell: bash
        run: bash build_macos.sh "${{ matrix.target_architecture }}"

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Preserve signal-tester firmware downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download --pattern "*.uf2" --dir release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release/*
          --verify-tag
          --title "MeshLab RF ${GITHUB_REF_NAME}"
          --generate-notes
